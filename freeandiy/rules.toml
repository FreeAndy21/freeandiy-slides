to = "assets/app-icon/{{this.repo}}-small.svg"

[[copy]]
from = "freeandiy/assets/icons/{{this.key}}/mark-128.png"
to = "assets/app-icon/{{this.repo}}-mark.png"

[[copy]]
from = "freeandiy/assets/icons/{{this.key}}/macos-1024.png"
to = "assets/app-icon/{{this.repo}}-1024.png"

[[copy]]
from = "freeandiy/assets/icons/{{this.key}}/{{this.key}}.icns"
to = "assets/app-icon/{{this.repo}}.icns"

[[copy]]
from = "freeandiy/assets/icons/{{this.key}}/{{this.key}}.ico"
to = "assets/app-icon/{{this.repo}}.ico"

[[copy]]
from = "freeandiy/assets/icons/{{this.key}}/{{this.key}}.svg"
to = "assets/app-icon/hicolor/scalable/apps/{{this.app_id}}.svg"

[[copy]]
from = "freeandiy/assets/icons/{{this.key}}/hicolor/16.png"
to = "assets/app-icon/hicolor/16x16/apps/{{this.app_id}}.png"

[[copy]]
from = "freeandiy/assets/icons/{{this.key}}/hicolor/24.png"
to = "assets/app-icon/hicolor/24x24/apps/{{this.app_id}}.png"

[[copy]]
from = "freeandiy/assets/icons/{{this.key}}/hicolor/32.png"
to = "assets/app-icon/hicolor/32x32/apps/{{this.app_id}}.png"

[[copy]]
from = "freeandiy/assets/icons/{{this.key}}/hicolor/48.png"
to = "assets/app-icon/hicolor/48x48/apps/{{this.app_id}}.png"

[[copy]]
from = "freeandiy/assets/icons/{{this.key}}/hicolor/64.png"
to = "assets/app-icon/hicolor/64x64/apps/{{this.app_id}}.png"

[[copy]]
from = "freeandiy/assets/icons/{{this.key}}/hicolor/128.png"
to = "assets/app-icon/hicolor/128x128/apps/{{this.app_id}}.png"

[[copy]]
from = "freeandiy/assets/icons/{{this.key}}/hicolor/256.png"
